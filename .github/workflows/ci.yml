name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Migrations match the models
        env: { DATABASE_URL: "sqlite:////tmp/ci.db", SECRET_KEY: ci-only-secret-key-ci-only-secret-key }
        run: alembic upgrade head && alembic check

  api-mariadb:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: learn_test }
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1/learn_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Migrations on MariaDB
        env: { DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1/learn_test?charset=utf8mb4", SECRET_KEY: ci-only-secret-key-ci-only-secret-key }
        run: alembic upgrade head && alembic check

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e "api[dev]"
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
