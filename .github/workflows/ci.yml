name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Migrations match the models
        env: { DATABASE_URL: "sqlite:////tmp/ci.db", SECRET_KEY: ci-only-secret-key-ci-only-secret-key }
        run: alembic upgrade head && alembic check

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e "api[dev]"
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
