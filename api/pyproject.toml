[project]
name = "iniyavan-learn-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "nh3>=0.2.17",
  "cryptography>=42",
  "pypdf>=4.2",
  "pdfplumber>=0.11.4",
  "python-multipart>=0.0.9",
  "pymysql>=1.1",
  "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
